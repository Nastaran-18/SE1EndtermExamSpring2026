name: CI - Run tests and generate coverage report

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: 40231453
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        working-directory: 40231453
        env:
          PYTHONPATH: .
        run: |
          coverage run -m pytest tests/ -v
          coverage report
          coverage json -o coverage.json
          python3 scripts/coverage_to_csv.py coverage.json coverage.csv

      - name: Commit coverage report
        working-directory: 40231453
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.csv
          git diff --cached --quiet || git commit -m "ci: update coverage.csv [skip ci]"
          git push
